<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Flashcards</title>
  <link rel="stylesheet" href="../assets/design.css">
  <script>
    try {
      const s = localStorage.getItem('site-theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.setAttribute('data-theme', 'dark');
      else if (s === 'light')
        document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>
</head>
<body>

  <header>
    <div class="breadcrumb"><a href="../">Preparation Library</a> / AWS</div>
    <h1 id="topicTitle">AWS Flashcards</h1>
    <p id="topicSubtitle">Pick a service to start studying</p>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"></button>
  </header>

  <main class="wrap narrow">
    <div class="card-grid cols-2" id="topicsGrid"></div>
  </main>

  <script src="../assets/theme.js"></script>
  <script>
    const topics = [
      { name: 'IAM', description: 'Identity & Access Management', count: 20, path: 'IAM/' },
      { name: 'SQS', description: 'Simple Queue Service', count: 15, path: 'SQS/' }
    ];

    const grid = document.getElementById('topicsGrid');
    topics.forEach(t => {
      const a = document.createElement('a');
      a.href = t.path;
      a.className = 'link-card';
      a.innerHTML = `
        <span class="lc-tag">${t.count} questions</span>
        <div class="lc-title">${t.name}</div>
        <p class="lc-desc">${t.description}</p>
      `;
      grid.appendChild(a);
    });
  </script>

</body>
</html>
